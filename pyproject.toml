[project]
name = "security-diagnosis-agent"
version = "0.1.0"
description = "설계문서와 코드를 받아 보안 통제 누락을 근거와 함께 알려 주는 진단 Agent"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "openai>=1",
  "jinja2",
  "tree-sitter",
  "tree-sitter-java",
  "fastapi>=0.162.2",
  "uvicorn>=0.54.0",
  "sqlalchemy>=2.1.8",
  "alembic>=1.20.1",
  "psycopg[binary]>=3.3.8",
  "langsmith>=0.14.17",
]

[project.scripts]
secagent = "agent.cli.main:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 컨테이너와 DB가 필요한 시험은 -m docker, -m postgres로 따로 돌린다.
addopts = "-m 'not docker and not postgres'"
# langsmith 패키지가 자기 내부 모듈을 불러올 때 내는 경고다. 우리 코드와 무관하다.
filterwarnings = ["ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning"]
markers = [
  "docker: 실제 컨테이너가 필요한 시험",
  "postgres: 로컬 PostgreSQL이 필요한 시험",
]

[tool.ruff]
line-length = 120
