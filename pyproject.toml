[project]
name = "security-diagnosis-agent"
version = "0.1.0"
description = "설계문서와 코드를 받아 보안 통제 누락을 근거와 함께 알려 주는 진단 Agent"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "openai>=1",
  "jinja2",
  "tree-sitter",
  "tree-sitter-java",
]

[project.scripts]
secagent = "agent.cli.main:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: 실제 컨테이너가 필요한 시험",
  "postgres: 로컬 PostgreSQL이 필요한 시험",
]

[tool.ruff]
line-length = 120
