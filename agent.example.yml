# 복사해서 agent.yml로 쓴다(커밋하지 않는다). 키는 환경변수로 넘긴다.
# OPENAI_API_KEY는 api.openai.com으로만 나간다. 다른 주소의 키는 LLM_API_KEY로 넘긴다.
base_url: https://api.openai.com/v1
# 모델은 비용과 성능을 보고 사용자가 정한다. 값이 없으면 그 역할은 호출하지 않고 실패한다.
models:
  onboard: null
  investigate: null
  review: null
  fix: null
# 추론 강도(low, medium, high). 모델이 추론만 하다 한도에 걸리면 낮춘다.
reasoning_effort: null
# 도구와 추론 강도를 함께 받지 않는 모델(예: gpt-6.1-terra)은 none으로 둔다. 탐색은 추론 없이, 최종 답은 위 강도로 받는다.
tool_reasoning_effort: null
# LangSmith 추적. 프로젝트 이름을 적으면 켜진다. .env의 SECAGENT_LANGSMITH_PROJECT로도 켤 수 있다(키는 LANGSMITH_API_KEY).
# 비밀값을 가린 뒤의 프롬프트와 응답이 LangSmith로 간다.
langsmith_project: null
# 먼저 돌릴 SAST 도구. 이름을 적으면 rules/scanners/<이름>.yml 정의를 쓴다. 비우면 돌리지 않는다.
# 모든 도구는 Docker에서 네트워크 없이, 코드는 읽기 전용으로 돈다. 결과는 SARIF로 받는다.
scanners:
  - semgrep
  # - codeql   # 로컬 이미지 빌드와 라이선스 확인이 먼저다(README "CodeQL")
  # 직접 정의하는 예. 상대 경로는 실행한 폴더 기준이다.
  # - name: my-tool
  #   image: example/my-tool:1.2.3
  #   command: [my-tool, --sarif, --output, "{sarif}", "{rules}", .]
  #   rules: [my-rules/*.yml]
  #   rule_arg: --config
