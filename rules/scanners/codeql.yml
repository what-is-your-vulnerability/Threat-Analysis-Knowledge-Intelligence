# CodeQL(Java, 빌드 없는 모드). 이미지는 deploy/scanners/codeql/Dockerfile로 로컬에서 빌드하고 레지스트리에서 받지 않는다.
# 라이선스: GitHub Advanced Security 없이는 OSI 오픈소스 코드와 학술 연구·시연에만 쓴다. 사내 비공개 코드에 쓰기 전에 라이선스를 확인한다.
name: codeql
image: secagent-codeql:2.27.4
pull: never
platform: linux/amd64
languages: [java]
# 컨테이너는 Docker VM 메모리(8GiB 기기에서 약 7.75GiB)보다 낮게, --ram(MB)은 컨테이너보다 2GiB 낮게 둔다.
memory: 6g
timeout_seconds: 1800
command:
  - sh
  - -c
  - >-
    codeql database create /work/db --language=java --build-mode=none --source-root=/src --threads=4 --ram=4096
    && codeql database analyze /work/db codeql/java-queries:codeql-suites/java-security-extended.qls
    --format=sarif-latest --threads=4 --ram=4096 --output={sarif}
