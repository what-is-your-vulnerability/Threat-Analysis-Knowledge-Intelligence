# 외부 LLM에 보내기 전에 가리는 값. group이 있으면 그 부분만 가린다.
- name: openai_key
  pattern: '\bsk-[A-Za-z0-9_-]{16,}'
- name: aws_key
  pattern: '\bAKIA[0-9A-Z]{16}\b'
- name: private_key
  pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----'
- name: jwt
  pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
- name: password_value
  pattern: '(?i)(?:password|passwd|pwd|secret|api_?key)\s*[:=]\s*["'']([^"''\n]{4,})["'']'
  group: 1
- name: resident_number
  pattern: '\b\d{6}-[1-8]\d{6}\b'
- name: card_number
  pattern: '\b\d{4}[- ]\d{4}[- ]\d{4}[- ]\d{4}\b'
