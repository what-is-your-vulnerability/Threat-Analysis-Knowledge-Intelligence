# 외부 LLM에 보내기 전에 가리는 값. group이 있으면 그 부분만 가린다.
- name: openai_key
  pattern: '\bsk-[A-Za-z0-9_-]{16,}'
- name: aws_key
  pattern: '\bAKIA[0-9A-Z]{16}\b'
- name: private_key
  pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----'
- name: jwt
  pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
- name: password_value
  pattern: '(?i)[\w.-]*(?:pass|pwd|secret|api[-_]?key|credential)[\w.-]*\s*[:=]\s*["''](?!\$\{)([^"''\n]{4,})["'']'
  group: 1
# 설정 파일(.yml, .properties, .env 등)에만 쓰는 따옴표 없는 값. 코드의 타입 표기와 대입은 건드리지 않는다.
- name: config_secret
  pattern: '(?im)^[ \t]*[\w.-]*(?:pass|pwd|secret|token|credential|api[-_]?key)[\w.-]*[ \t]*[:=][ \t]*(?!\$\{)([^\s"''#]{4,})[ \t]*$'
  group: 1
  config_only: true
- name: jdbc_password
  pattern: 'jdbc:\w+:(?:\w+:)?[^/\s@:]+/([^@\s]+)@'
  group: 1
- name: url_password
  pattern: '://[^/\s:@]+:([^@\s/]+)@'
  group: 1
- name: resident_number
  pattern: '\b\d{6}-[1-8]\d{6}\b'
- name: card_number
  pattern: '\b\d{4}[- ]\d{4}[- ]\d{4}[- ]\d{4}\b'
